spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: seeex-tech-web
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/seeex?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
file-service:
  base-url: ${FILE_SERVICE_BASE_URL:http://localhost:8081}
  token: ${FILE_SERVICE_TOKEN:}
wecom:
  base-url: ${WECOM_BASE_URL:https://qyapi.weixin.qq.com}
  corp-id: ${WECOM_CORP_ID:}
  agent-id: ${WECOM_AGENT_ID:}
  redirect-uri: ${WECOM_REDIRECT_URI:http://localhost:3000/wecom/callback}
  secret: ${WECOM_SECRET:}
  token: ${WECOM_TOKEN:}
  aes-key: ${WECOM_AES_KEY:}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.show-details: when-authorized

onboarding:
  portal-url: ${APP_ONBOARDING_PORTAL_URL:}
  delivery-key: ${APP_DELIVERY_KEY:}
  delivery-key-id: ${APP_DELIVERY_KEY_ID:v1}
  wecom-notifications-enabled: ${APP_ONBOARDING_WECOM_NOTIFICATIONS:false}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
bootstrap:
  admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    login: ${BOOTSTRAP_ADMIN_LOGIN:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
